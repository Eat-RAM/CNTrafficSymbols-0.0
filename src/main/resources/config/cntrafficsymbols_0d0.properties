# Before modifying
#
# To modify this file within the jar takes no effect; in order to apply your
# changes, you have to copy this file to ${GAMEDIR}/config/.

# Common Settings - Cold Configurations
# You need to restart the game to make changes of these configurations.

# Fluidlogging rules (Evaluated top-to-bottom, first match wins)
# Syntax: <glob_pattern>=<none|vanilla|reflog>; ...
# Supports wildcards '*' and '?'
fluidlogging_rules=\
    floor_line_eighths*=none;\
    *=vanilla
# Block MapColor rules (Evaluated top-to-bottom, first match wins)
# Syntax: <glob_pattern>=<dry_color>[/<fluid_color>]; ...
# Colors: clear, green, cyan, orange, purple, etc. (case-insensitive)
# If fluid_color is omitted, it defaults to dry_color.
block_map_colors=\
    highway_*hm=green/cyan;\
    highway_km=green/cyan;\
    barricades_1=orange/purple;\
    *=clear
# To enable blockstates' optimizations of the blocks created by specified
# classes. Use ";" to separate classes. To disable all optimizations, just
# simply comment the following one line out. May conflict with other mods, use
# with caution.
blockstate_optimizations=io.github.eat_ram.cntrafficsymbols.v0d0.block.FloorLineEighthBlock

# Common Settings - Hot Configurations
# You can change these configurations in-game; however this does not mean that
# modifying this file can immediately make changes of them.

# To enable Floor Line Eighths block's hard-coded loot table. Accept one of
# the following values:
# true | yes | always - Always enabled.
# auto | null - Enabled when loot table
# cntrafficsymbols_0d0:blocks/floor_line_eighths is absent, disabled
# otherwise.
# false | no | never - Always disabled.
hardcoded_floor_line_eighths_loot_enabled=auto

# To control the behaviour of WallBlock up-connecting to HighwayKmSignBlock.
# Accept one of the following values:
# unset - Use vanilla behaviour.
# none - Make the HighwayKmSignBlock treated as air.
# thin_up - Raise the wall side to 1-block high, as if it's a full cube.
# fat_up - Raise the wall side to 1-block high, like #wall_post_override.
highway_hm_wall_up_connection_mode=thin_up
